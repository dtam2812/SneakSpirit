services:
  # Frontend: React/Vite → Nginx
  frontend:
    build:
      context: ./client/project
      dockerfile: ../Dockerfile
      args:
        VITE_API_URL: https://sneakspirit-1.onrender.com
    container_name: sneakspirit_frontend
    networks:
      - sneakspirit_net
    restart: unless-stopped

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: sneakspirit_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - sneakspirit_net
    depends_on:
      - frontend
    restart: unless-stopped

networks:
  sneakspirit_net:
    driver: bridge
